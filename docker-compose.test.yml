services:
  mock-oidc:
    image: wg-easy-e2e:local
    entrypoint: ["node"]
    command: ["/mock-oidc/server.mjs"]
    environment:
      MOCK_OIDC_GROUPS: ${E2E_OIDC_GROUPS:-vpn-users}
    volumes:
      - ./src/test/e2e/mock-oidc:/mock-oidc:ro
    ports:
      # The browser resolves the mock-oidc hostname to this published port.
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:9000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  wg-easy:
    image: wg-easy-e2e:local
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
      DEBUG: ""
      PORTAL_WIPE_LEGACY: "1"
      OAUTH_OIDC_SERVER: http://mock-oidc:9000
      OAUTH_OIDC_NAME: Mock OIDC
      OAUTH_OIDC_CLIENT_ID: wg-easy
      OAUTH_OIDC_CLIENT_SECRET: e2e-secret
      OIDC_ALLOWED_GROUPS: vpn-users
      VPN_HOST: vpn.example.test
      VPN_PORT: "51820"
    depends_on:
      mock-oidc:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    ports:
      - "127.0.0.1::51821"
    networks:
      default:
        aliases:
          - vpn.example.test
    volumes:
      - wireguard:/etc/wireguard
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wg show wg0 public-key >/dev/null &&
          node -e "fetch('http://127.0.0.1:51821/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  vpn-client:
    image: wg-easy-e2e:local
    command: ["dumb-init", "sleep", "infinity"]
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      disable: true

volumes:
  wireguard:
