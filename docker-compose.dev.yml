services:
  wg-easy:
    build:
      dockerfile: ./Dockerfile.dev
    command: dev
    tmpfs:
      - /app/.nuxt
    volumes:
      - /lib/modules:/lib/modules:ro
      # - ./data/:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      INSECURE: "true"
      OAUTH_OIDC_SERVER: ${OAUTH_OIDC_SERVER:?set OAUTH_OIDC_SERVER}
      OAUTH_OIDC_NAME: ${OAUTH_OIDC_NAME:-OIDC}
      OAUTH_OIDC_CLIENT_ID: ${OAUTH_OIDC_CLIENT_ID:?set OAUTH_OIDC_CLIENT_ID}
      OAUTH_OIDC_CLIENT_SECRET: ${OAUTH_OIDC_CLIENT_SECRET:?set OAUTH_OIDC_CLIENT_SECRET}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:?set OIDC_ALLOWED_GROUPS}
      VPN_HOST: ${VPN_HOST:-localhost}
      VPN_PORT: ${VPN_PORT:-51820}
      PORTAL_WIPE_LEGACY: "1"

    develop:
      watch:
        - action: sync
          path: ./src
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
            - coverage/
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
